Screens:
  MainScreen1:
    Properties:
      Fill: =RGBA(234, 234, 234, 1)
      LoadingSpinnerColor: =RGBA(164, 38, 44, 1)
    Children:
      - ScreenContainer1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 250, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =15
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - TableNameContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =68
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                Children:
                  - TableNameLabel1:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =RGBA(164, 38, 44, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =68
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Size: =16
                        Text: =DataSourceInfo([@'Projects-Tracker-Primary'], DataSourceInfo.DisplayName)
            - BodyContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - SidebarContainer1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(And(MainScreen1.Size = ScreenSize.Small, Or(newMode, editMode, itemSelected)), 0, 3)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinWidth: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =10
                        Visible: =If(And(MainScreen1.Size = ScreenSize.Small, Or(newMode, editMode, itemSelected)), false, true)
                      Children:
                        - SearchContainer1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(245, 245, 245, 1)
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - SearchInput1:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =1
                                    Color: =RGBA(70, 68, 64, 1)
                                    Default: =""
                                    DisabledBorderColor: =ColorFade(Self.BorderColor, 40%)
                                    DisabledColor: =ColorFade(Self.Color, 40%)
                                    DisabledFill: =Self.Fill
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    FocusedBorderThickness: =3
                                    Font: =Font.'Open Sans'
                                    Height: =44
                                    HintText: ="Search"
                                    HoverBorderColor: =Self.Color
                                    HoverColor: =Self.Color
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    LayoutMinWidth: =0
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Size: =14
                              - SearchIcon1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(164, 38, 44, 1)
                                    DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                    DisabledColor: =RGBA(119, 119, 119, 1)
                                    Height: =44
                                    Icon: =Icon.Search
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    Width: =44
                        - NewRecordButtonBarContainer1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - NewRecordAddIcon1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    Height: =44
                                    Icon: =Icon.Add
                                    OnSelect: |-
                                      =NewForm(Form1); UpdateContext({ newMode: true, useCalcTotals: false, stageOverride: "Pre-Estimate" });
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    Width: =44
                              - NewRecordLabel1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    Height: =44
                                    Text: ="New"
                        - RecordsListSeparator1:
                            Control: Rectangle@2.3.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(89, 0, 0, 1)
                              Fill: =RGBA(164, 38, 44, 1)
                              Height: =1
                              LayoutMinWidth: =200
                        - RecordsGallery1:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(89, 0, 0, 1)
                              Default: =CurrentItem
                              Fill: =RGBA(250, 250, 250, 1)
                              Items: =Search([@'Projects-Tracker-Primary'], SearchInput1.Text, Title, 'Site Address', 'Agency/Insurer')
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =UpdateContext({ itemSelected: true, CurrentItem: ThisItem })
                              TemplateFill: =If(ThisItem.IsSelected, RGBA(230, 230, 230, 1), RGBA(0, 0, 0, 0))
                              TemplateSize: =128
                            Children:
                              - Title1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Self.Size * 1.8
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =ThisItem.Title
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.TemplateWidth - 86
                                    X: =16
                                    Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle1.Size * 1.8 + 2 + Body1.Size * 1.8 + SchedulingReadinessGalleryLabel1.Size * 1.8)) / 2
                              - Subtitle1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Self.Size * 1.8
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.'Site Address'
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Title1.Width
                                    X: =Title1.X
                                    Y: =Title1.Y + Title1.Height
                              - Body1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Self.Size * 1.8
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =If(IsBlank(ThisItem.Status), "No status", ThisItem.Status) & " | NOA: " & If(IsBlank(ThisItem.'NOA Received'), "-", ThisItem.'NOA Received') & If(ThisItem.'Has attachments', " | Docs", "")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Title1.Width
                                    X: =Title1.X
                                    Y: =Subtitle1.Y + Subtitle1.Height
                              - SchedulingReadinessGalleryLabel1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: |-
                                      =If(Or(And(And(Not(IsBlank(Trim(ThisItem.Status))), Trim(ThisItem.Status) <> "Pending Bid"), Not(Or(Trim(ThisItem.Status) in ["Ready For Scheduling", "Scheduled", "Active", "Awaiting Signoff", "Ready To Bill", "Awaiting Payment", "Paid", "Warranty", "Closed"], Not(IsBlank(Find("contract", Lower(ThisItem.Notes))))))), And(Or(Not(IsBlank(Trim(ThisItem.'Agency/Insurer'))), Trim(ThisItem.Status) = "Awaiting NOA"), Not(And(Not(IsBlank(Trim(ThisItem.'NOA Received'))), Not(Trim(ThisItem.'NOA Received') in ["No", "N", "Pending", "Not Received", "NA", "N/A", "-", "None"]))))), RGBA(164, 38, 44, 1), If(Or(Not(And(Not(IsBlank(Trim(ThisItem.Status))), Trim(ThisItem.Status) <> "Pending Bid")), IsBlank(Find("consent", Lower(ThisItem.Notes)))), RGBA(176, 120, 0, 1), RGBA(16, 124, 16, 1)))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Self.Size * 1.8
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =If(Or(And(And(Not(IsBlank(Trim(ThisItem.Status))), Trim(ThisItem.Status) <> "Pending Bid"), Not(Or(Trim(ThisItem.Status) in ["Ready For Scheduling", "Scheduled", "Active", "Awaiting Signoff", "Ready To Bill", "Awaiting Payment", "Paid", "Warranty", "Closed"], Not(IsBlank(Find("contract", Lower(ThisItem.Notes))))))), And(Or(Not(IsBlank(Trim(ThisItem.'Agency/Insurer'))), Trim(ThisItem.Status) = "Awaiting NOA"), Not(And(Not(IsBlank(Trim(ThisItem.'NOA Received'))), Not(Trim(ThisItem.'NOA Received') in ["No", "N", "Pending", "Not Received", "NA", "N/A", "-", "None"]))))), "Scheduling: Blocked" & If(And(And(Not(IsBlank(Trim(ThisItem.Status))), Trim(ThisItem.Status) <> "Pending Bid"), Not(Or(Trim(ThisItem.Status) in ["Ready For Scheduling", "Scheduled", "Active", "Awaiting Signoff", "Ready To Bill", "Awaiting Payment", "Paid", "Warranty", "Closed"], Not(IsBlank(Find("contract", Lower(ThisItem.Notes))))))), " | Contract", "") & If(And(Or(Not(IsBlank(Trim(ThisItem.'Agency/Insurer'))), Trim(ThisItem.Status) = "Awaiting NOA"), Not(And(Not(IsBlank(Trim(ThisItem.'NOA Received'))), Not(Trim(ThisItem.'NOA Received') in ["No", "N", "Pending", "Not Received", "NA", "N/A", "-", "None"])))), " | NOA", ""), If(Not(And(Not(IsBlank(Trim(ThisItem.Status))), Trim(ThisItem.Status) <> "Pending Bid")), "Scheduling: Bid stage", If(IsBlank(Find("consent", Lower(ThisItem.Notes))), "Scheduling: Ready (verify consent)", "Scheduling: Ready")))
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Title1.Width
                                    X: =Title1.X
                                    Y: =Body1.Y + Body1.Height
                              - NextArrow1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: =Self.Tooltip
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(166, 166, 166, 1)
                                    Height: =50
                                    Icon: =Icon.ChevronRight
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    Tooltip: ="View item details"
                                    Width: =50
                                    X: =Parent.TemplateWidth - Self.Width - 12
                                    Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                              - Separator1:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =8
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - Self.Height
                              - Rectangle1:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Fill: =RGBA(89, 0, 0, 1)
                                    Height: =Parent.TemplateHeight - Separator1.Height
                                    OnSelect: =Select(Parent)
                                    Visible: =ThisItem.IsSelected
                                    Width: =4
                  - RightContainer1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =7
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =2
                        PaddingLeft: =2
                        PaddingRight: =2
                        PaddingTop: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =If(Or(deleteMode, And(MainScreen1.Size = ScreenSize.Small, !newMode, !editMode, !itemSelected)), false, true)
                        Width: =0
                      Children:
                        - SelectedRecordHeaderContainer1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                            Children:
                              - BackIconButton1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    Height: =50
                                    Icon: =Icon.ChevronLeft
                                    OnSelect: |-
                                      =UpdateContext({ itemSelected: false })
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    TabIndex: =0
                                    Visible: =If(MainScreen1.Size = ScreenSize.Small, And(!editMode, !newMode, !deleteMode), false)
                                    Width: =50
                              - SelectedRecordTitle1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    Text: =RecordsGallery1.Selected.'Title'
                              - SelectedRecordDocsLabel1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =If(RecordsGallery1.Selected.'Has attachments', RGBA(16, 124, 16, 1), RGBA(166, 166, 166, 1))
                                    FillPortions: =0
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =50
                                    LayoutMinWidth: =120
                                    Size: =12
                                    Text: |-
                                      =If(RecordsGallery1.Selected.'Has attachments', "Docs attached", "No docs")
                                    Tooltip: ="Documents for this project are listed in the Attachments section of the form."
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =!newMode
                                    Width: =120
                              - OpenFolderIconButton1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: =Self.Tooltip
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    DisplayMode: |-
                                      =If(IsBlank(Trim(RecordsGallery1.Selected.Title)), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =50
                                    Icon: =Icon.Folder
                                    OnSelect: |-
                                      =Launch("https://bhhomesolutions.sharepoint.com/sites/BrickyardHousesHomeSolutionsLLC/Shared Documents/Forms/AllItems.aspx?id=" & EncodeUrl("/sites/BrickyardHousesHomeSolutionsLLC/Shared Documents/Projects/" & Trim(RecordsGallery1.Selected.Title)))
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    TabIndex: =0
                                    Tooltip: ="Open this project's document folder in SharePoint"
                                    Visible: =And(!newMode, !deleteMode)
                                    Width: =50
                              - SubmitFormButton1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    Height: =50
                                    Icon: =Icon.Check
                                    OnSelect: =SubmitForm(Form1)
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    TabIndex: =0
                                    Visible: =Or(editMode, newMode)
                                    Width: =50
                              - ResetFormButton1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    Height: =50
                                    Icon: =Icon.Cancel
                                    OnSelect: |-
                                      =ResetForm(Form1); UpdateContext({ editMode: false, newMode: false, useCalcTotals: false, stageOverride: Blank() });
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    TabIndex: =0
                                    Visible: =Or(editMode, newMode)
                                    Width: =50
                              - EditIconButton1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    Height: =50
                                    Icon: =Icon.Edit
                                    OnSelect: |-
                                      =UpdateContext({ editMode: true, selectedRecord: RecordsGallery1.Selected, stageOverride: Blank(), useCalcTotals: false })
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    TabIndex: =0
                                    Visible: =And(!editMode, !newMode, !deleteMode)
                                    Width: =50
                              - DeleteIconButton1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    Color: =RGBA(89, 0, 0, 1)
                                    Height: =50
                                    Icon: =Icon.Trash
                                    OnSelect: |-
                                      =UpdateContext({ deleteMode: true, deleteCancelled: false, selectedRecord: RecordsGallery1.Selected })
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    TabIndex: =0
                                    Visible: =And(!editMode, !newMode, !deleteMode)
                                    Width: =50
                        - MainContainer1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                            Children:
                              - Form1:
                                  Control: Form@2.4.4
                                  Variant: Classic
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(89, 0, 0, 1)
                                    DataSource: =[@'Projects-Tracker-Primary']
                                    DefaultMode: =If(newMode, FormMode.New, editMode, FormMode.Edit, FormMode.View)
                                    Item: =RecordsGallery1.Selected
                                    LayoutMinWidth: =300
                                    NumberOfColumns: =2
                                    OnFailure: =Notify("Cannot save. Please check if there are errors in the form.", NotificationType.Error)
                                    OnSuccess: |-
                                      =UpdateContext({ CurrentItem: Self.LastSubmit, editMode: false, newMode: false, useCalcTotals: false, stageOverride: Blank() })
                                  Children:
                                    - Title_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicTextualEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =RGBA(89, 0, 0, 1)
                                          DataField: ="Title"
                                          Default: =ThisItem.Title
                                          DisplayName: =DataSourceInfo([@'Projects-Tracker-Primary'],DataSourceInfo.DisplayName,'Title')
                                          MaxLength: =DataSourceInfo([@'Projects-Tracker-Primary'], DataSourceInfo.MaxLength, 'Title')
                                          Required: =false
                                          Update: =DataCardValue1.Text
                                          Width: =458
                                          X: =0
                                          Y: =0
                                        Children:
                                          - DataCardKey1:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =RGBA(0, 0, 0, 1)
                                                Color: =RGBA(89, 0, 0, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =34
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                X: =30
                                                Y: =10
                                          - DataCardValue1:
                                              Control: Classic/TextInput@2.3.2
                                              MetadataKey: FieldValue
                                              Properties:
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                                Default: =Parent.Default
                                                DelayOutput: =true
                                                DisplayMode: =Parent.DisplayMode
                                                Font: =Font.'Open Sans'
                                                HoverBorderColor: =RGBA(89, 0, 0, 1)
                                                HoverFill: =RGBA(222, 179, 184, 1)
                                                MaxLength: =Parent.MaxLength
                                                PaddingLeft: =5
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Tooltip: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =DataCardKey1.Y + DataCardKey1.Height + 5
                                          - ErrorMessage1:
                                              Control: Label@2.5.1
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =RGBA(0, 0, 0, 1)
                                                Color: =RGBA(168, 0, 0, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =10
                                                Live: =Live.Assertive
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =Parent.DisplayMode=DisplayMode.Edit
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =DataCardValue1.Y + DataCardValue1.Height
                                          - StarVisible1:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                BorderColor: =RGBA(0, 0, 0, 1)
                                                Color: =RGBA(89, 0, 0, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =DataCardKey1.Height
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Wrap: =false
                                                Y: =DataCardKey1.Y
                                    - Site Address_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicTextualEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =RGBA(89, 0, 0, 1)
                                          DataField: ="field_1"
                                          Default: =ThisItem.'Site Address'
                                          DisplayName: =DataSourceInfo([@'Projects-Tracker-Primary'],DataSourceInfo.DisplayName,'field_1')
                                          MaxLength: =DataSourceInfo([@'Projects-Tracker-Primary'], DataSourceInfo.MaxLength, 'field_1')
                                          Required: =false
                                          Update: =DataCardValue2.Text
                                          Width: =458
                                          X: =1
                                          Y: =0
                                        Children:
                                          - DataCardKey2:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
